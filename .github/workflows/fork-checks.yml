name: Fork checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_API_URL_DEV: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:54329/lp2_test
      - run: npm run type-check
      - run: npm run test:unit -- --runInBand __tests__/orderIntegrity.unit.test.ts __tests__/pushService.unit.test.ts __tests__/realtimeAuthorization.unit.test.ts __tests__/realtimeSubscriptions.unit.test.ts __tests__/help.socket-performance.unit.test.ts
      - run: npm run test:platform-pilot
      - run: npm run test:realtime-wire
