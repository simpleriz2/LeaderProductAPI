name: Fork checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_API_URL_DEV: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/legacyPublicationDisabled.test.cjs
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:54329/lp2_test
      - run: npm run type-check
      - run: npm run test:unit -- --runInBand __tests__/orderIntegrity.unit.test.ts __tests__/pushService.unit.test.ts __tests__/realtimeAuthorization.unit.test.ts __tests__/realtimeSubscriptions.unit.test.ts __tests__/help.socket-performance.unit.test.ts __tests__/qr.security.unit.test.ts __tests__/qr.image-options.unit.test.ts __tests__/qr.contact.unit.test.ts
      - uses: actions/checkout@v4
        with:
          repository: simpleriz2/LeaderProductAPP
          ref: 4a70a0726f321b23dc89e2945cb5a6f83ed2fb4a
          path: partner-app
          sparse-checkout: src/entities/qr
          persist-credentials: false
      - run: npm run test:qr-contact-contract
        env:
          LP2_APP_ROOT: ${{ github.workspace }}/partner-app
      - run: npm run test:platform-pilot
      - run: npm run test:realtime-wire
  realtime-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: lp2_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: lp2_realtime_fixture
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd "pg_isready -U lp2_fixture -d lp2_realtime_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lp2_fixture:fixture-only@127.0.0.1:54329/lp2_realtime_fixture
      REDIS_DISABLE: '1'
      ACCESS_TOKEN_SECRET: lp2-fixture-access-only-no-production
      REFRESH_TOKEN_SECRET: lp2-fixture-refresh-only-no-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - name: Mark this newly created fixture database
        run: node dev/realtime/markFixture.cjs
      - run: npm run test:realtime-postgres
      - run: npm run test:qr-company-postgres
        env:
          LP2_COMPANY_TEST_DATABASE_URL: postgresql://lp2_fixture:fixture-only@127.0.0.1:54329/lp2_realtime_fixture
